<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Expander Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        max-width: 860px;
        margin: 32px auto;
        padding: 0 18px 40px;
        line-height: 1.45;
      }
      h1 { margin-bottom: 4px; }
      .muted { color: #667085; margin-top: 0; }
      .card {
        border: 1px solid #d0d5dd;
        border-radius: 12px;
        padding: 18px;
        margin-top: 18px;
      }
      label {
        display: block;
        font-weight: 650;
        margin: 14px 0 6px;
      }
      input, textarea, select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        font: inherit;
      }
      textarea { resize: vertical; min-height: 90px; }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }
      button.secondary { background: #475467; }
      button.danger { background: #dc2626; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #status {
        min-height: 24px;
        margin-top: 12px;
        font-weight: 650;
      }
      #status.ok { color: #15803d; }
      #status.error { color: #dc2626; }
      .list-header, .snippet-row {
        display: grid;
        grid-template-columns: 180px 1fr auto;
        gap: 12px;
        align-items: start;
      }
      .list-header {
        font-weight: 750;
        padding: 10px 0;
        border-bottom: 1px solid #d0d5dd;
      }
      .snippet-row {
        padding: 10px 0;
        border-bottom: 1px solid #eaecf0;
      }
      .trigger {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        word-break: break-word;
      }
      .snippet { white-space: pre-wrap; word-break: break-word; }
      .empty { color: #667085; padding: 14px 0; }
      code {
        background: rgba(127,127,127,0.15);
        border-radius: 4px;
        padding: 2px 5px;
      }
      @media (max-width: 700px) {
        .row, .list-header, .snippet-row { grid-template-columns: 1fr; }
        .list-header { display: none; }
      }
    </style>
  </head>
  <body>
    <h1>Text Expander</h1>
    <p class="muted">Create triggers like <code>;addr</code>. Type the trigger, then press <strong>Space</strong>, <strong>Enter</strong>, or <strong>Tab</strong> to expand it.</p>

    <section class="card" aria-labelledby="editorTitle">
      <h2 id="editorTitle">Add or update snippet</h2>
      <div class="row">
        <div>
          <label for="trigger">Trigger</label>
          <input id="trigger" maxlength="80" placeholder="e.g. ;addr" autocomplete="off" />
        </div>
        <div>
          <label for="search">Search snippets</label>
          <input id="search" placeholder="Filter by trigger or text" autocomplete="off" />
        </div>
      </div>

      <label for="text">Snippet text</label>
      <textarea id="text" maxlength="20000" placeholder="e.g. 123 Main St"></textarea>

      <div class="buttons">
        <button id="saveBtn">Add / Update</button>
        <button id="clearBtn" class="secondary">Clear form</button>
        <button id="removeBtn" class="danger">Remove trigger</button>
        <button id="exportBtn" class="secondary">Export JSON</button>
        <button id="importBtn" class="secondary">Import JSON</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card" aria-labelledby="listTitle">
      <h2 id="listTitle">All snippets</h2>
      <div class="list-header">
        <div>Trigger</div>
        <div>Snippet</div>
        <div>Action</div>
      </div>
      <div id="list"></div>
    </section>

    <script src="options.js"></script>
  </body>
</html>
